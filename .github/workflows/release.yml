name: Publish PyPI package
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed package version
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: pypi-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Verify version and release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$VERSION" = "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$(git ls-remote origin refs/tags/v$VERSION^{} | cut -f1)" = "$(git rev-parse HEAD)"
      - run: python -m pip install '.[dev]'
      - run: python -m pytest
      - run: ruff check .
      - run: python scripts/check-package.py
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
